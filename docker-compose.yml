# Neighbor Partner - two-service Docker stack (Req 7.1)
# Targets a Raspberry Pi with 4 GB of memory using the small llama3.2:1b model (Req 7.2)
services:
  # Flask web app served by gunicorn
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      # URL of the local Ollama service inside the compose network
      OLLAMA_URL: http://ollama:11434
      # Small model chosen to fit a 4 GB Raspberry Pi (Req 7.2)
      OLLAMA_MODEL: llama3.2:1b
      # SQLite file lives on the persisted db_data volume (Req 6.1)
      DB_PATH: /data/shops.db
    volumes:
      # Persist the SQLite database across container restarts (Req 6.1)
      - db_data:/data
    depends_on:
      - ollama

  # Locally hosted Ollama model server
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      # Persist pulled models so they survive restarts
      - ollama_data:/root/.ollama

# Named volumes for durable storage
volumes:
  db_data:
  ollama_data:
